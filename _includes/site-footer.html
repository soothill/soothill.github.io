<footer class="site-footer">
  <div class="shell footer-grid">
    <div>
      <a class="footer-mark" href="{{ '/' | relative_url }}">Soot / Silicon</a>
      <p>{{ site.tagline }}</p>
    </div>
    <div class="footer-links" aria-label="Footer links">
      <a href="{{ '/blog/' | relative_url }}">Field notes</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a>
      <a href="{{ site.linkedin_url }}" rel="me">LinkedIn</a>
    </div>
    <div class="footer-meta">
      <p>Written and tested in {{ site.location }}.</p>
      <p>&copy; {{ 'now' | date: '%Y' }} Darren Soothill.</p>
    </div>
  </div>
</footer>

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1efe8">
  <title>Offline — Soot / Silicon</title>
  <style>
    :root { --paper:#f1efe8; --ink:#171815; --soft:#66665e; --soot:#11191a; --orange:#ee4f27; --acid:#d7ed5a; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(920px,100%); display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--ink); box-shadow:12px 12px 0 #ded8ca; }
    .message { padding:clamp(32px,7vw,74px); background:#faf9f5; }
    .label { margin:0 0 54px; color:var(--orange); font-family:ui-monospace,SFMono-Regular,monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(48px,8vw,82px); font-weight:400; letter-spacing:-.055em; line-height:.9; }
    p { max-width:420px; margin:28px 0; color:var(--soft); line-height:1.65; }
    button { min-width:180px; padding:13px 16px; display:flex; justify-content:space-between; border:1px solid var(--ink); border-radius:0; color:white; background:var(--ink); font:700 12px inherit; cursor:pointer; }
    button:hover { background:var(--orange); border-color:var(--orange); }
    .system { min-height:500px; padding:28px; display:flex; flex-direction:column; justify-content:space-between; color:white; background:var(--soot); }
    .mark { color:var(--acid); font-family:ui-monospace,SFMono-Regular,monospace; font-size:12px; }
    .route { border-top:1px solid #455253; }
    .route span { display:block; height:1px; margin-top:38px; background:var(--orange); }
    .route span:nth-child(2) { width:72%; }
    .route span:nth-child(3) { width:44%; }
    .status { margin:0; color:#aab4b1; font-family:ui-monospace,SFMono-Regular,monospace; font-size:10px; text-transform:uppercase; }
    .status::before { content:""; display:inline-block; width:7px; height:7px; margin-right:10px; border-radius:50%; background:var(--orange); }
    @media(max-width:700px){ main{grid-template-columns:1fr;box-shadow:7px 7px 0 #ded8ca}.system{min-height:260px}.message{padding:42px 28px}.label{margin-bottom:38px} }
  </style>
</head>
<body>
  <main>
    <section class="message">
      <p class="label">Soot / Silicon · connection state</p>
      <h1>Off the<br>network.</h1>
      <p>This field note is not in the local cache. Check the connection and try the route again.</p>
      <button type="button" onclick="window.location.reload()"><span>Try again</span><span aria-hidden="true">↗</span></button>
    </section>
    <aside class="system" aria-hidden="true">
      <span class="mark">S/S</span>
      <div class="route"><span></span><span></span><span></span></div>
      <p class="status">Network unavailable</p>
    </aside>
  </main>
  <script>window.addEventListener('online',function(){window.location.reload();});</script>
</body>
</html>

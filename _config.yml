# Jekyll Configuration for GitHub Pages Blog
title: "Soot / Silicon"
description: "Darren Soothill investigates storage, GPUs and local AI by testing systems, recording failures and explaining what the results change."
author: "Darren Soothill"
email: "darren@soothill.com"
url: "https://www.soothill.io"
baseurl: ""

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Permalink structure for blog posts
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Darren Soothill"

# Exclude files from processing
exclude:
  - README.md
  - HOWTO-ADD-POSTS.md
  - SETUP-COMPLETE.md
  - TODO.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  # Private analytics exports must never be rendered or published by Jekyll.
  - reports
  # Local sync-conflict copies of legacy pages. Keep them out of the built site
  # so crawlers can only reach the canonical editorial pages.
  - "useful-commands 2.html"
  - "documents/certifications 2.html"
  - "documents/contact-info 2.html"
  - "documents/portfolio 2.html"
  - "documents/publications 2.html"
  - "documents/resume 2.html"

# Analytics
google_analytics: G-4KVJSXV6TK

# SEO settings
twitter:
  username: soothill
  card: summary_large_image

social:
  name: Darren Soothill
  links:
    - https://github.com/soothill
    - https://www.linkedin.com/in/darrensoothill

# Editorial settings
tagline: "Practical tests of storage, GPUs and local AI."
location: "Newport Pagnell, UK"
role: "Director of Product"
author_description: "Director of Product Darren Soothill sets direction for storage and GPU products and tests the system behaviour behind the decision."
github_username: soothill
linkedin_url: "https://www.linkedin.com/in/darrensoothill"
social_image: "/assets/images/og-default.png"

# The field-notes archive renders site.posts directly, so it intentionally has
# one canonical index rather than duplicate paginated copies.

# Date format
date_format: "%-d %B %Y"

# Excerpt settings
excerpt_separator: "<!--more-->"
show_excerpts: true

name: Site quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate editorial standard
        run: python3 scripts/validate_editorial.py

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Validate SEO and indexing invariants
        run: python3 scripts/validate_site.py _site

      - name: Install HTMLProofer
        run: gem install html-proofer --no-document

      - name: Check internal links
        run: |
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls '/^mailto:/,/^https:\/\/consent\.cookiebot\.com/'

      - name: Check external links
        run: python3 scripts/check_external_links.py _site

name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Validate SEO and indexing invariants
        run: python3 scripts/validate_site.py _site

      - name: Check internal links
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls '/^mailto:/,/^https:\/\/consent\.cookiebot\.com/'
